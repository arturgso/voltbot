services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: volt_evolution_api
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:7800:8080"
    env_file:
      - .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${EVOLUTION_API_URL:-http://${BIND_IP:-127.0.0.1}:7800}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD:-evolution}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: enel_auto
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      TELEMETRY: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - voltbot

  postgres:
    image: postgres:15-alpine
    container_name: volt_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltbot

  redis:
    image: redis:7-alpine
    container_name: volt_evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    networks:
      - voltbot

  voltbot:
    build: .
    container_name: voltbot_app
    profiles:
      - app
    env_file:
      - .env
    environment:
      DOWNLOADS_DIR: /app/downloads
      STATE_PATH: /app/state/state.json
      DB_PATH: /app/data/voltbot.db
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-VoltBot}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3600}
    volumes:
      - ./downloads:/app/downloads
      - ./state:/app/state
      - enel_data:/app/data
    depends_on:
      evolution-api:
        condition: service_started
    networks:
      - voltbot

  voltbot-web:
    build: .
    container_name: voltbot_web
    restart: unless-stopped
    entrypoint: ["voltbot-web"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BIND_IP:-127.0.0.1}:7801:8000"
    env_file:
      - .env
    environment:
      DOWNLOADS_DIR: /app/downloads
      STATE_PATH: /app/state/state.json
      DB_PATH: /app/data/voltbot.db
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-VoltBot}
    volumes:
      - ./downloads:/app/downloads
      - ./state:/app/state
      - enel_data:/app/data
    depends_on:
      evolution-api:
        condition: service_started
    networks:
      - voltbot

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
  enel_data:

networks:
  voltbot:
