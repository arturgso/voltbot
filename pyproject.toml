[project]
name = "voltbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artur Oliveira", email = "arturgs.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imap-tools>=1.15.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=8.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "httpx>=0.28.1",
]

[project.scripts]
voltbot = "voltbot.main:main"
voltbot-send-test = "voltbot.manual_send:main"
voltbot-web = "voltbot.web:serve"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
