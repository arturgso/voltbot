name: CI/CD local

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Atualizar o servidor web local após os testes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voltbot-local
  cancel-in-progress: false

jobs:
  validar:
    # Sem fallback para máquinas hospedadas pelo GitHub.
    runs-on: [self-hosted, Linux, X64, voltbot-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: false
          version: '0.13.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Testar backend sem serviços reais
        run: |
          uv sync --locked --python 3.14
          uv run --no-sync pytest
      - name: Validar e compilar frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Atualizar servidor web local
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
        env:
          VOLTBOT_DEPLOY_DIR: /home/artur/Repo/voltbot
        run: bash scripts/ci/deploy.sh
